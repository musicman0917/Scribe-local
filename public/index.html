<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scribe Local</title>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="icon" href="data:,">
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
  <header class="border-b border-gray-200 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-500 flex items-center justify-center font-bold text-gray-900">S</div>
        <span class="text-lg font-semibold">Scribe Local</span>
        <span class="text-xs text-gray-400 border border-gray-200 rounded-full px-2 py-0.5 ml-2">self-hosted</span>
      </div>
      <nav class="flex items-center gap-3">
        <a href="/settings.html" class="btn-ghost">Settings</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-semibold">Your Tutorials</h1>
        <p class="text-sm text-gray-500 mt-1">Capture, annotate, and export step-by-step software walkthroughs.</p>
      </div>
      <button id="new-tutorial-btn" class="btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/></svg>
        New Tutorial
      </button>
    </div>

    <div id="empty-state" class="hidden card p-12 text-center">
      <p class="text-gray-500">No tutorials yet. Create your first one to start capturing steps.</p>
    </div>

    <div id="tutorial-list" class="grid gap-4 sm:grid-cols-2"></div>
  </main>

  <dialog id="new-tutorial-dialog" class="rounded-xl p-0 w-full max-w-md backdrop:bg-gray-900/40">
    <form id="new-tutorial-form" class="card p-6 space-y-4 w-full">
      <h2 class="text-lg font-semibold">New Tutorial</h2>
      <div>
        <label class="label" for="nt-title">Title</label>
        <input id="nt-title" name="title" class="input" placeholder="e.g. How to start streaming in OBS Studio" required />
      </div>
      <div>
        <label class="label" for="nt-desc">Description (optional)</label>
        <textarea id="nt-desc" name="description" rows="3" class="input" placeholder="A short summary shown at the top of the exported tutorial."></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="nt-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Create &amp; Open</button>
      </div>
    </form>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
